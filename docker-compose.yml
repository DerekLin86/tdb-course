version: '3.8'

services:
  backend:
    image: ghcr.io/${IMAGE_REPO:-dereklin86/tdb-course}/tdb-backend:${IMAGE_TAG:-latest}
    container_name: tdb-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/triple_d_ballet.db
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化資料庫路徑：存放 SQLite 資料庫檔案（NAS 建議掛載 /volume1/docker/triple-d-ballet/data）
      - ${DATA_VOLUME_PATH:-./data}:/app/data
    expose:
      - "8000"
    networks:
      - tdb-net

  frontend:
    image: ghcr.io/${IMAGE_REPO:-dereklin86/tdb-course}/tdb-frontend:${IMAGE_TAG:-latest}
    container_name: tdb-frontend
    restart: unless-stopped
    ports:
      # 外部訪問端口：可依 Synology NAS 習慣修改為其他 port，如 8088:80
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - tdb-net

  # 選用服務：自動輪詢 GHCR 更新映像檔並無感重啟容器
  watchtower:
    image: containrrr/watchtower:latest
    container_name: tdb-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
    command: tdb-frontend tdb-backend
    profiles:
      - auto-update
    networks:
      - tdb-net

networks:
  tdb-net:
    driver: bridge
