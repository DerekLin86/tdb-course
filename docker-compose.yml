version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tdb-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/triple_d_ballet.db
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化資料庫路徑：存放 SQLite 資料庫檔案
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - tdb-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tdb-frontend
    restart: unless-stopped
    ports:
      # 外部訪問端口：可依 Synology NAS 習慣修改為其他 port，如 8088:80
      - "8080:80"
    depends_on:
      - backend
    networks:
      - tdb-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tdb-cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=eyJhIjoiZTU5Y2ZiYTMzY2JjYzA0MjI1ZmUwNTFkOTQ1ZGZmZmQiLCJ0IjoiYTkyOTc0NGYtNWQyMS00OWVkLWEyNDgtY2Y3ZWEzM2ZmNzJjIiwicyI6Ill6VTFNemxpWlRBdE1EWmxPUzAwWWpnekxUa3paVEl0TVdVM05EUXdZVFU0WlRKaiJ9
    command: tunnel --no-autoupdate run
    depends_on:
      - frontend
    networks:
      - tdb-net

networks:
  tdb-net:
    driver: bridge
