name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'Dockerfile.frontend'
      - 'nginx.conf'
      - 'package*.json'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lowercase repository name
        id: repo
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/tdb-backend:latest
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/tdb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/tdb-frontend:latest
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/tdb-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
